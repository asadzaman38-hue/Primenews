<!-- Meta Basics -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ if .Title }}{{ .Title }} | {{ end }}PrimeNews</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}Daily trending USA and global news updates{{ end }}">

<!-- SEO -->
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ .Permalink }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico">

<!-- Monetag Ads -->
<script src="https://quge5.com/88/tag.min.js" data-zone="250477" async data-cfasync="false"></script>

<!-- Google Analytics (GA4) -->
<!-- yahan apna GA ID lagana hoga -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XXXXXXX');
</script>
